version: '3.8'

services:
  mysql:
    image: docker.io/library/mysql:8.0
    container_name: ekatarsip_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - ekatarsip_mysql_data:/var/lib/mysql
      # Skema & data awal diimpor otomatis HANYA saat volume data masih kosong
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - ekatarsip_net

  backend:
    build:
      context: ./backend
    container_name: ekatarsip_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CLIENT_URL: ${CLIENT_URL:-*}
      UPLOAD_MAX_SIZE_MB: ${UPLOAD_MAX_SIZE_MB:-15}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-E-KATARSIP <no-reply@papuabaratdaya.go.id>}
      OTP_EXPIRY_MINUTES: ${OTP_EXPIRY_MINUTES:-10}
    volumes:
      - ekatarsip_uploads:/app/src/uploads/arsip
    networks:
      - ekatarsip_net

  frontend:
    build:
      context: ./frontend
    container_name: ekatarsip_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - ekatarsip_net

networks:
  ekatarsip_net:
    driver: bridge

volumes:
  ekatarsip_mysql_data:
  ekatarsip_uploads: