# Konfigurasi Nginx di dalam kontainer frontend.
# Menyajikan aset statis React (hasil build Vite) dan meneruskan
# permintaan API serta file arsip ke kontainer backend.
# services/api.js pada frontend memanggil path relatif "/api",
# sehingga tidak perlu variabel VITE_API_URL sama sekali.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    # Aplikasi React (SPA) - fallback ke index.html untuk client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Diteruskan ke backend Express (nama service "backend" pada docker-compose)
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Salinan digital arsip yang diunggah, disajikan langsung oleh backend
    location /uploads/ {
        proxy_pass http://backend:5000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ~* \.(js|css|svg|png|jpg|jpeg|webp|woff2?)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }
}
